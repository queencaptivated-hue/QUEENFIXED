<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events &amp; Entertainment | Queen Captivated</title>
<meta name="description" content="Discover events, book tickets and get QR tickets with Queen Captivated.">
<!-- Leave content empty = "opening soon" page (free, no server needed).
     When your events service is online on Render, paste its address between the quotes, e.g. https://queen-captivated-events-api.onrender.com -->
<meta name="qc-events-api" content="">
<script src="/events-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a10;--card:#1d121a;--line:#3a2733;--fg:#f4ece0;--mut:#b9a99a;--gold:#d9b77e;--wine:#4a1230;--ok:#7ad39a;--bad:#ff8a80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Raleway,system-ui,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0 0 .4em}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(18,10,16,.95);z-index:5}
.logo{font:700 1.25rem "Playfair Display",serif;color:var(--gold)}header nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:.92rem}
main{max-width:1100px;margin:0 auto;padding:28px 5vw 60px}.mut{color:var(--mut)}.err{color:var(--bad);min-height:1.3em;font-size:.9rem}.ok{color:var(--ok)}
.btn{display:inline-block;border:0;border-radius:8px;padding:12px 22px;background:linear-gradient(135deg,#c9a56a,#e8d3a8);color:#1a0f14;font:700 .95rem Raleway,sans-serif;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:not-allowed}.btn.alt{background:none;border:1px solid var(--gold);color:var(--gold)}.lnk{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;text-decoration:underline}
input,select{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#160d14;color:var(--fg);font:inherit}
.filters{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr auto;gap:10px;margin:18px 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:block}.card:hover{border-color:var(--gold)}
.poster{aspect-ratio:16/10;background:linear-gradient(135deg,var(--wine),#120a10);display:grid;place-items:center;color:var(--gold);font:700 1.4rem "Playfair Display",serif;text-align:center;padding:10px}
.poster img{width:100%;height:100%;object-fit:cover;display:block}.card .in{padding:14px}.tag{font-size:.75rem;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--gold);background:none;color:var(--gold);font-size:1.1rem;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:20;padding:16px}.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:380px;width:100%}.box input{margin:10px 0 4px}
.tk{display:flex;gap:16px;align-items:center;background:#fff;color:#111;border-radius:12px;padding:12px;margin:10px 0}.tk svg{width:130px;height:130px;flex:none}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.on{background:var(--gold);color:#1a0f14}.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{font-size:.82rem;color:var(--mut)}.fg .w{grid-column:1/-1}textarea{width:100%;min-height:90px;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#160d14;color:var(--fg);font:inherit}
.sm{padding:6px 12px;font-size:.82rem}.btn.no{background:none;border:1px solid var(--bad);color:var(--bad)}@media(max-width:800px){.fg{grid-template-columns:1fr}}
@media(max-width:800px){.filters,.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a class="logo" href="/">Queen Captivated</a>
<nav><a data-r href="/events/explore">Explore events</a><a data-r href="/events/my-tickets">My tickets</a><a data-r href="/events/publish">Publish your event</a><span id="who"></span></nav></header>
<main id="app"></main><div id="modal"></div>
<script>
const API_BASE=String((window.QC_EVENTS&&window.QC_EVENTS.api)||document.querySelector('meta[name=qc-events-api]').content||'').trim().replace(/\/$/,''),SOON=!API_BASE,OFFLINE=SOON,API=API_BASE+'/api/events';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=p=>'₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2});
const when=d=>new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
let token=localStorage.getItem('qce_token');
function logout(){token=null;localStorage.removeItem('qce_token');who()}
function who(){if(OFFLINE){$('#who').innerHTML='';const m=document.querySelector('header nav a[href$="my-tickets"]');if(m)m.hidden=true;return}$('#who').innerHTML=token?'<button class="lnk" id="lo">Log out</button>':'<button class="lnk" id="li">Log in</button>';($('#lo')||$('#li')).onclick=()=>token?(logout(),go('/events/explore')):ensureLogin()}
async function api(path,o={}){if(OFFLINE)throw Object.assign(new Error('offline'),{offline:true});const h={};if(token)h.Authorization='Bearer '+token;let b;if(o.form)b=o.form;else if(o.body){h['Content-Type']='application/json';b=JSON.stringify(o.body)}
 const r=await fetch(API+path,{method:o.method||'GET',headers:h,body:b}).catch(()=>{throw Object.assign(new Error('Can’t reach the server.'),{offline:true})});const j=await r.json().catch(()=>({}));
 if(r.status===401&&token)logout();if(!r.ok)throw new Error(j.error||'Something went wrong.');return j}
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Couldn’t load the payment window.'));document.head.appendChild(s)})}

/* ---------- login (email code) ---------- */
function ensureLogin(){if(token)return Promise.resolve();return new Promise((ok,no)=>{const m=$('#modal');let t='';
 const close=()=>{m.innerHTML=''};const box=h=>{m.innerHTML=`<div class="ov"><div class="box">${h}<div class="err" id="e"></div></div></div>`};const e=x=>{$('#e').textContent=x};
 const s1=()=>{box('<h3>Log in</h3><p class="mut">We’ll email you a 6-digit code.</p><input id="t" type="email" placeholder="Email address" autocomplete="email"><br><button class="btn" id="go">Send code</button> <button class="lnk" id="x">Cancel</button>');$('#x').onclick=()=>{close();no(new Error('cancelled'))};
  $('#go').onclick=async()=>{t=$('#t').value.trim();try{$('#go').disabled=true;await api('/auth/otp/request',{method:'POST',body:{target:t}});s2()}catch(x){e(x.message);$('#go').disabled=false}}};
 const s2=(name)=>{box(`<h3>Enter your code</h3><p class="mut">Sent to ${esc(t)}</p><input id="c" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">${name?'<input id="n" placeholder="Your full name">':''}<br><button class="btn" id="go">Verify</button> <button class="lnk" id="x">Cancel</button>`);$('#x').onclick=()=>{close();no(new Error('cancelled'))};
  $('#go').onclick=async()=>{try{const r=await api('/auth/otp/verify',{method:'POST',body:{target:t,code:$('#c').value.trim(),full_name:$('#n')?.value.trim()||undefined}});
   if(r.needs_name){const c=$('#c').value;s2(true);$('#c').value=c;e('Welcome! Please tell us your name.');return}token=r.token;localStorage.setItem('qce_token',token);who();close();ok()}catch(x){e(x.message)}}};s1()})}

/* ---------- router ---------- */
function go(u){history.pushState({},'',u);route()}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-r]');if(a&&!e.metaKey&&!e.ctrlKey){e.preventDefault();go(a.getAttribute('href'))}});
addEventListener('popstate',route);
async function route(){if(SOON)return soon();const p=location.pathname.replace(/^\/events\/?/,'').split('/').filter(Boolean),q=new URLSearchParams(location.search);scrollTo(0,0);
 try{if(!p.length||p[0]==='explore')await explore(q);else if(p[0]==='event')await eventPage(p[1]);else if(p[0]==='checkout')await checkout(p[1]);else if(p[0]==='booking')await returned(p[1]);else if(p[0]==='my-tickets')await myTickets();else if(p[0]==='publish')await publish();else if(p[0]==='admin')await admin();else app.innerHTML='<h2>Page not found</h2><a data-r class="btn" href="/events/explore">See events</a>'}
 catch(x){if(x.offline)return soon();app.innerHTML=`<h2>Something went wrong</h2><p class="err">${esc(x.message)}</p><a data-r class="btn alt" href="/events/explore">Back to events</a>`}}

/* ---------- explore ---------- */
const card=e=>`<a data-r class="card" href="/events/event/${encodeURIComponent(e.slug)}"><div class="poster">${e.poster_url?`<img loading="lazy" alt="" src="${esc(e.poster_url)}">`:esc(e.title)}</div><div class="in"><div class="tag">${esc(e.category_name||'Event')}</div><h3>${esc(e.title)}</h3><div class="mut">${when(e.starts_at)}<br>${esc([e.venue,e.city].filter(Boolean).join(', '))}</div><div style="margin-top:8px">${e.sold_out?'<span class="pill">Sold out</span>':e.status==='postponed'?'<span class="pill">Postponed</span>':e.from_price_paise!=null?'From <b>'+(e.from_price_paise?inr(e.from_price_paise):'Free')+'</b>':''}</div></div></a>`;
async function explore(q){const cats=(await api('/public/categories')).categories;
 app.innerHTML=`<h1>Discover Events. Book Experiences. Create Memories.</h1><form class="filters" id="f"><input name="q" placeholder="Event name" value="${esc(q.get('q')||'')}"><select name="category"><option value="">All categories</option>${cats.map(c=>`<option value="${esc(c.slug)}"${q.get('category')===c.slug?' selected':''}>${esc(c.name)}</option>`).join('')}</select><input name="city" placeholder="City" value="${esc(q.get('city')||'')}"><input type="date" name="date" value="${esc(q.get('date')||'')}"><button class="btn">Search</button></form><div class="grid" id="g"></div><p id="m" class="mut"></p><button class="btn alt" id="more" hidden>Load more</button>`;
 $('#f').onsubmit=e=>{e.preventDefault();const u=new URLSearchParams([...new FormData(e.target)].filter(x=>x[1]));go('/events/explore'+(u.toString()?'?'+u:''))};
 let page=1;const load=async()=>{const u=new URLSearchParams(q);u.set('page',page);const r=await api('/public?'+u);$('#g').insertAdjacentHTML('beforeend',r.events.map(card).join(''));
  $('#m').textContent=r.total?'':'No events match your search yet.';$('#more').hidden=page*12>=r.total};$('#more').onclick=()=>{page++;load()};await load()}

/* ---------- event details + tickets ---------- */
async function eventPage(slug){const r=await api('/public/'+encodeURIComponent(slug)),e=r.event,qty={};
 const total=()=>r.tickets.reduce((s,t)=>s+(qty[t.id]||0)*t.price_paise,0),count=()=>Object.values(qty).reduce((a,b)=>a+b,0);
 app.innerHTML=`<a data-r class="mut" href="/events/explore">← All events</a><div class="two" style="margin-top:12px"><div><div class="poster" style="border-radius:12px;margin-bottom:16px">${e.poster_url?`<img alt="" src="${esc(e.poster_url)}">`:esc(e.title)}</div><div class="tag">${esc(e.category_name||'')}</div><h1>${esc(e.title)}</h1>${e.status!=='published'?`<p class="err">${e.status==='postponed'?'Postponed':e.status==='cancelled'?'Cancelled':'Closed'}${e.status_note?': '+esc(e.status_note):''}</p>`:''}<p style="white-space:pre-wrap">${esc(e.description||'')}</p><h3>When &amp; where</h3><p>${when(e.starts_at)}<br>${esc(e.venue||'')}, ${esc(e.address||'')}, ${esc(e.city||'')}<br>${e.google_maps_url?`<a class="tag" target="_blank" rel="noopener" href="${esc(e.google_maps_url)}">Open in Google Maps</a>`:e.latitude?`<a class="tag" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${e.latitude},${e.longitude}">Open in Google Maps</a>`:''}</p>${r.schedule.length?'<h3>Schedule</h3>'+r.schedule.map(s=>`<div class="row"><span>${esc(s.title)}</span><span class="mut">${when(s.starts_at)}</span></div>`).join(''):''}<p class="mut">By ${esc(e.organiser)}</p></div>
 <div><div class="panel"><h3>Tickets</h3>${r.tickets.map(t=>`<div class="row"><div><b>${esc(t.name)}</b><br><span class="mut">${t.price_paise?inr(t.price_paise):'Free'}${t.available&&t.available<=10?' · only '+t.available+' left':''}</span></div>${t.on_sale?`<div class="qty"><button data-d="-1" data-t="${t.id}">−</button><b id="q${t.id}">0</b><button data-d="1" data-t="${t.id}">+</button></div>`:`<span class="pill">${t.available?'Not on sale':'Sold out'}</span>`}</div>`).join('')}<div class="row"><b>Total</b><b id="tot">₹0</b></div><div class="err" id="e"></div><button class="btn" id="bk" style="width:100%"${e.booking_open?'':' disabled'}>${e.booking_open?'Book tickets':'Booking closed'}</button><p class="mut" style="font-size:.8rem">A small service fee may be added at checkout.</p></div></div></div>`;
 app.onclick=ev=>{const b=ev.target.closest('[data-t]');if(!b)return;const t=r.tickets.find(x=>x.id===b.dataset.t);qty[t.id]=Math.max(0,Math.min(Math.min(t.max_per_booking,t.available),(qty[t.id]||0)+Number(b.dataset.d)));$('#q'+t.id).textContent=qty[t.id];$('#tot').textContent=inr(total())};
 $('#bk').onclick=async()=>{if(!count())return $('#e').textContent='Choose at least one ticket.';$('#e').textContent='';$('#bk').disabled=true;
  try{await ensureLogin();   const c=await api('/checkout',{method:'POST',body:{event_id:e.id,items:Object.entries(qty).filter(x=>x[1]).map(([category_id,q])=>({category_id,qty:q})),idempotency_key:crypto.randomUUID()}});
   sessionStorage.setItem('qce_co_'+c.booking.id,JSON.stringify({...c,title:e.title}));go('/events/checkout/'+c.booking.id)}catch(x){if(x.message!=='cancelled')$('#e').textContent=x.message}$('#bk').disabled=false}}

/* ---------- checkout ---------- */
async function checkout(id){await ensureLogin();const st=JSON.parse(sessionStorage.getItem('qce_co_'+id)||'null');
 const cur=await api('/bookings/'+id);if(cur.booking.status==='confirmed')return go('/events/my-tickets');
 if(!st||cur.booking.status!=='pending_payment'){app.innerHTML='<h2>This reservation has expired</h2><p class="mut">Tickets are held for a few minutes. Please start again.</p><a data-r class="btn" href="/events/explore">Back to events</a>';return}
 const b=cur.booking;let timer;
 app.innerHTML=`<h1>Checkout</h1><div class="two"><div class="panel"><h3>${esc(st.title||'Your booking')}</h3><div class="row"><span>Booking</span><b>${esc(b.reference)}</b></div><div class="row"><span>Tickets</span><span>${inr(b.subtotal_paise)}</span></div>${b.discount_paise?`<div class="row"><span>Discount</span><span>−${inr(b.discount_paise)}</span></div>`:''}${b.service_fee_paise?`<div class="row"><span>Service fee</span><span>${inr(b.service_fee_paise)}</span></div>`:''}<div class="row"><b>Total</b><b>${inr(b.total_paise)}</b></div><p class="mut">Held for you: <b id="cd"></b></p></div><div class="panel" id="pay"><h3>Pay with</h3>${st.methods.length?st.methods.map(m=>`<button class="btn alt" style="width:100%;margin-bottom:10px" data-p="${m.code}">${esc(m.display_name)}</button>`).join(''):'<p class="err">No payment method is available right now. Please try later.</p>'}<div class="err" id="e"></div></div></div>`;
 const tick=()=>{const s=Math.max(0,Math.round((new Date(b.hold_expires_at)-Date.now())/1000));$('#cd').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)clearInterval(timer)};tick();timer=setInterval(()=>{if(!$('#cd'))return clearInterval(timer);tick()},1000);
 const poll=async(n=0)=>{try{const r=await api(`/bookings/${id}/refresh`,{method:'POST',body:{}});if(r.booking.status==='confirmed')return go('/events/my-tickets')}catch(x){}if(n<20&&$('#pay'))setTimeout(()=>poll(n+1),3000);else if($('#e'))$('#e').textContent='We haven’t received the payment confirmation yet. Check My tickets in a minute.'};
 $('#pay').onclick=async ev=>{const bt=ev.target.closest('[data-p]');if(!bt)return;$('#e').textContent='';bt.disabled=true;
  try{const p=await api(`/bookings/${id}/pay`,{method:'POST',body:{provider:bt.dataset.p}});
   if(p.provider==='razorpay'){await loadScript('https://checkout.razorpay.com/v1/checkout.js');new Razorpay({key:p.key_id,order_id:p.order_id,amount:p.amount,currency:p.currency,name:p.name,description:p.description,theme:{color:'#4a1230'},handler:async r=>{try{await api(`/bookings/${id}/refresh`,{method:'POST',body:r})}catch(x){}poll()},modal:{ondismiss:()=>{bt.disabled=false}}}).open()}
   else if(p.provider==='cashfree'){await loadScript('https://sdk.cashfree.com/js/v3/cashfree.js');Cashfree({mode:p.env}).checkout({paymentSessionId:p.payment_session_id,redirectTarget:'_self'})}
   else{$('#pay').innerHTML=`<h3>Pay by UPI</h3><p class="mut">Scan with any UPI app, pay exactly <b>${inr(p.amount_paise)}</b>, and add <b>${esc(p.note)}</b> as the note.</p><div style="background:#fff;padding:10px;border-radius:10px;text-align:center"><img alt="UPI QR code" style="max-width:240px;width:100%" src="${esc(p.qr_image_url)}"></div><p class="mut">UPI ID: <b>${esc(p.upi_id)}</b></p><a class="btn alt" href="${esc(p.upi_link)}">Open my UPI app</a><h3 style="margin-top:18px">I’ve paid</h3><input id="u" placeholder="UTR / transaction ID (from your UPI app)"><div style="margin:8px 0"><input id="s" type="file" accept="image/*"></div><div class="err" id="e"></div><button class="btn" id="cl">Submit payment details</button>`;
    $('#cl').onclick=async()=>{const f=new FormData();f.append('utr',$('#u').value.trim());f.append('payment_id',p.payment_id);if($('#s').files[0])f.append('screenshot',$('#s').files[0]);
     try{$('#cl').disabled=true;await api(`/bookings/${id}/upi-claim`,{method:'POST',form:f});$('#pay').innerHTML='<h3 class="ok">Thank you!</h3><p>We’ll verify your payment and your tickets will appear in <a data-r href="/events/my-tickets"><u>My tickets</u></a>. This page updates by itself.</p>';poll()}catch(x){$('#e').textContent=x.message;$('#cl').disabled=false}}}}
  catch(x){$('#e').textContent=x.message;bt.disabled=false}}}
async function returned(ref){await ensureLogin();const m=(await api('/me/bookings')).bookings.find(b=>b.reference===ref);if(m){try{await api(`/bookings/${m.id}/refresh`,{method:'POST',body:{}})}catch(x){}}go('/events/my-tickets')}

/* ---------- my tickets ---------- */
async function myTickets(){await ensureLogin();const r=await api('/me/bookings');
 app.innerHTML='<h1>My tickets</h1>'+(r.bookings.length?r.bookings.map(b=>`<div class="panel" style="margin-bottom:18px"><div class="row" style="border:0"><div><h3 style="margin:0">${esc(b.title)}</h3><span class="mut">${when(b.starts_at)} · ${esc(b.venue||'')} ${esc(b.city||'')}</span></div><span class="pill">${esc(b.status.replace('_',' '))}</span></div><div class="mut">Booking ${esc(b.reference)} · ${inr(b.total_paise)}</div>${b.tickets.map(t=>`<div class="tk"><span data-qr="${t.id}"></span><div><b>${esc(t.category)}</b><br><span style="color:#555">${t.status==='valid'?'Show this code at the entrance':esc(t.status)}</span></div></div>`).join('')}</div>`).join(''):'<p class="mut">No bookings yet.</p><a data-r class="btn" href="/events/explore">Find an event</a>');
 for(const el of document.querySelectorAll('[data-qr]')){fetch(API+`/me/tickets/${el.dataset.qr}/qr.svg`,{headers:{Authorization:'Bearer '+token}}).then(x=>x.ok?x.text():'').then(s=>{if(s.startsWith('<svg')||s.includes('<svg'))el.innerHTML=s})}}

function soon(){document.querySelector('header nav').style.display='none';document.title='Events & Entertainment: opening soon | Queen Captivated';app.innerHTML='<div style="text-align:center;padding:60px 0"><div class="tag">Queen Captivated</div><h1 style="font-size:clamp(2rem,6vw,3.4rem)">Events &amp; Entertainment<br>is opening soon</h1><p class="mut" style="max-width:520px;margin:0 auto 26px">Discover events, book tickets and get your QR ticket on your phone. We’re getting everything ready. Please check back shortly.</p><a class="btn" href="/">Back to Queen Captivated</a> <a class="btn alt" href="/#contact">Contact us</a></div>'}
/* ---------- Publish your event: organiser registration + host area ---------- */
const F=(l,n,t='text',x='')=>`<div class="${x}"><label>${l}</label><input name="${n}" type="${t}" required></div>`;
async function publish(){app.innerHTML='<h1>Publish your event</h1><p class="mut" style="max-width:620px">Sell tickets for concerts, festivals, weddings and programmes. Apply as an organiser. Once our team approves you, you can create events and sell tickets.</p><div id="pb"></div>';const box=$('#pb');
 if(!token){box.innerHTML='<button class="btn" id="lg">Log in to apply</button>';$('#lg').onclick=async()=>{try{await ensureLogin();await publish()}catch(x){}};return}
 const o=(await api('/me')).organiser;
 if(!o||o.status==='rejected')return orgForm(box,o);
 if(o.status==='pending')box.innerHTML=`<div class="panel"><h3>Application under review</h3><p class="mut">Thank you, ${esc(o.org_name)}. We’ll email you once it’s approved.</p></div>`;
 else if(o.status==='approved')await host(box);else box.innerHTML='<div class="panel"><h3>Account paused</h3><p class="mut">Please contact us.</p></div>'}
function orgForm(box,o){box.innerHTML=`${o?.review_note?`<p class="err">Your last application wasn’t approved: ${esc(o.review_note)}. You can apply again.</p>`:''}<form class="panel fg" id="rf"><h3 class="w">Organiser application</h3>${F('Organisation / your name','org_name')}${F('Contact person','contact_name')}${F('Mobile (10 digits)','mobile','tel')}${F('Email','email','email')}${F('Address','address','text','w')}<div class="w"><label>About your events (optional)</label><textarea name="business_info"></textarea></div><h3 class="w">Payout details <span class="mut" style="font-size:.8rem">(stored encrypted)</span></h3>${F('Account holder name','bank_holder')}${F('Account number','bank_account')}${F('IFSC code','bank_ifsc')}<div class="w"><label>ID / business documents (up to 3 files: JPG, PNG or PDF)</label><input type="file" name="kyc" accept="image/*,.pdf" multiple required></div><div class="w err" id="e"></div><div class="w"><button class="btn">Submit application</button></div></form>`;
 $('#rf').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{e.target.querySelector('button').disabled=true;await api('/organiser/register',{method:'POST',form:fd});await publish()}catch(x){$('#e').textContent=x.message;e.target.querySelector('button').disabled=false}}}
async function host(box){const cats=(await api('/public/categories')).categories,mine=(await api('/organiser/events')).events;
 box.innerHTML=`<h2>My events</h2>${mine.length?mine.map(e=>`<div class="row"><div><b>${esc(e.title)}</b><br><span class="mut">${when(e.starts_at)} · sold ${e.sold}/${e.total}${e.status_note?' · '+esc(e.status_note):''}</span></div><div><span class="pill">${esc(e.status.replace('_',' '))}</span> ${e.status==='draft'?`<button class="btn sm" data-sub="${e.id}">Submit for approval</button>`:''}</div></div>`).join(''):'<p class="mut">No events yet. Create your first one below.</p>'}
 <form class="panel fg" id="ef" style="margin-top:20px"><h3 class="w">Create an event</h3>${F('Event title','title','text','w')}<div><label>Category</label><select name="cat">${cats.map(c=>`<option value="${esc(c.slug)}">${esc(c.name)}</option>`).join('')}</select></div>${F('Starts at','starts','datetime-local')}<div class="w"><label>Description</label><textarea name="description"></textarea></div>${F('Venue name','vname')}${F('City','city')}${F('Venue address','vaddr','text','w')}<h3 class="w">Tickets</h3><div class="w" id="tr"></div><div class="w"><button type="button" class="lnk" id="at">+ Add ticket type</button></div><div class="w"><label>Poster (optional)</label><input type="file" name="poster" accept="image/*"></div><div class="w err" id="e"></div><div class="w"><button class="btn">Save event</button></div></form>`;
 const row=(n='General',pr='',q='')=>`<div class="fg" style="margin-bottom:8px"><input class="tn" placeholder="Name" value="${n}"><div class="fg"><input class="tp" type="number" min="0" step="1" placeholder="Price ₹" value="${pr}"><input class="tq" type="number" min="1" placeholder="How many" value="${q}"></div></div>`;
 $('#tr').innerHTML=row();$('#at').onclick=()=>$('#tr').insertAdjacentHTML('beforeend',row('VIP'));
 box.onclick=async e=>{const b=e.target.closest('[data-sub]');if(!b)return;try{await api(`/organiser/events/${b.dataset.sub}/submit`,{method:'POST'});await publish()}catch(x){alert(x.message)}};
 $('#ef').onsubmit=async e=>{e.preventDefault();const f=e.target,v=n=>f.elements[n].value;try{f.querySelector('button.btn').disabled=true;
  const tc=[...document.querySelectorAll('#tr > .fg')].map(r=>({kind:'general',name:r.querySelector('.tn').value.trim(),price_paise:Math.round(Number(r.querySelector('.tp').value)*100),total_qty:Number(r.querySelector('.tq').value)}));
  const r=await api('/organiser/events',{method:'POST',body:{title:v('title'),description:v('description'),category_slug:v('cat'),starts_at:new Date(v('starts')).toISOString(),venue:{name:v('vname'),address:v('vaddr'),city:v('city')},ticket_categories:tc}});
  if(f.elements.poster.files[0]){const fd=new FormData();fd.append('image',f.elements.poster.files[0]);await api(`/organiser/events/${r.event.id}/poster`,{method:'POST',form:fd})}await publish()}catch(x){$('#e').textContent=x.message;f.querySelector('button.btn').disabled=false}}}

/* ---------- Admin: approve hosts and events, payment options, UPI claims ---------- */
async function admin(){await ensureLogin();const me=await api('/me');if(!me.roles.some(r=>/admin/.test(r))){app.innerHTML='<h2>Not allowed</h2><p class="mut">This area is for administrators.</p>';return}
 app.innerHTML='<h1>Admin</h1><div class="tabs"></div><div id="tb"></div>';const T={hosts:'Hosts',events:'Events',payments:'Payments',claims:'UPI claims'};
 const show=async k=>{[...document.querySelectorAll('.tabs button')].forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#tb').innerHTML='<p class="mut">Loading…</p>';try{await TABS[k]($('#tb'),()=>show(k))}catch(x){$('#tb').innerHTML=`<p class="err">${esc(x.message)}</p>`}};
 document.querySelector('.tabs').innerHTML=Object.entries(T).map(([k,l])=>`<button class="btn alt sm" data-k="${k}">${l}</button>`).join('');document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-k]');if(b)show(b.dataset.k)};show('hosts')}
const act=(path,body,again)=>async()=>{try{await api(path,{method:'POST',body});again()}catch(x){alert(x.message)}};
const TABS={
 async hosts(el,again){const r=(await api('/admin/organisers?status=pending')).organisers;el.innerHTML=r.length?r.map(o=>`<div class="panel" style="margin-bottom:12px"><b>${esc(o.org_name)}</b> <span class="mut">· ${esc(o.contact_name)} · ${esc(o.mobile)} · ${esc(o.email)}</span><p class="mut">${esc(o.address)}<br>${esc(o.business_info||'')}<br>Bank account ending ${esc(o.bank_last4)}</p>${Array.from({length:Number(o.documents)},(_,i)=>`<button class="btn alt sm" data-doc="${o.id}/${i}">Document ${i+1}</button> `).join('')}<div style="margin-top:10px"><button class="btn sm" data-ok="${o.id}">Approve</button> <button class="btn no sm" data-no="${o.id}">Reject</button></div></div>`).join(''):'<p class="mut">No applications waiting.</p>';
  el.onclick=async e=>{const d=e.target.closest('[data-doc]'),ok=e.target.closest('[data-ok]'),no=e.target.closest('[data-no]');
   if(d){const [id,n]=d.dataset.doc.split('/');const x=await fetch(API+`/admin/organisers/${id}/documents/${n}`,{headers:{Authorization:'Bearer '+token}});if(!x.ok)return alert('Could not open the document.');window.open(URL.createObjectURL(await x.blob()))}
   if(ok)act(`/admin/organisers/${ok.dataset.ok}/approve`,{},again)();if(no){const note=prompt('Reason for rejecting (the applicant will see this):');if(note)act(`/admin/organisers/${no.dataset.no}/reject`,{note},again)()}}},
 async events(el,again){const r=(await api('/admin/events?status=pending_approval')).events;el.innerHTML=r.length?r.map(e=>`<div class="row"><div><b>${esc(e.title)}</b><br><span class="mut">${esc(e.org_name)} · ${esc(e.city||'')} · ${when(e.starts_at)} · ${e.ticket_types} ticket type(s)</span></div><div><button class="btn sm" data-ok="${e.id}">Approve</button> <button class="btn no sm" data-no="${e.id}">Reject</button></div></div>`).join(''):'<p class="mut">No events waiting.</p>';
  el.onclick=e=>{const ok=e.target.closest('[data-ok]'),no=e.target.closest('[data-no]');if(ok)act(`/admin/events/${ok.dataset.ok}/approve`,{},again)();if(no){const note=prompt('Reason (the organiser will see this):');if(note)act(`/admin/events/${no.dataset.no}/reject`,{note},again)()}}},
 async payments(el,again){const r=(await api('/admin/payment-providers')).providers;el.innerHTML=`<div class="panel"><h3>Payment options</h3>${r.map(p=>`<div class="row"><div>${esc(p.display_name)}${p.credentials_set===false?' <span class="err">(keys not set on the server)</span>':''}</div><input type="checkbox" style="width:auto" data-pv="${p.code}"${p.is_enabled?' checked':''}></div>`).join('')}<div class="err" id="e"></div></div>
  <form class="panel" id="qf" style="margin-top:14px"><h3>UPI QR code</h3><p class="mut">Upload a clear picture of your UPI app’s QR (any-amount). The UPI ID is read from it automatically.</p><input type="file" name="image" accept="image/*" required><input name="payee_name" placeholder="Name shown to customers (optional)" style="margin-top:8px"><div class="err" id="qe"></div><button class="btn" style="margin-top:8px">Upload QR</button></form>`;
  el.onchange=async e=>{const c=e.target.closest('[data-pv]');if(!c)return;try{await api('/admin/payment-providers/'+c.dataset.pv,{method:'PATCH',body:{is_enabled:c.checked}})}catch(x){c.checked=!c.checked;$('#e').textContent=x.message}};
  $('#qf').onsubmit=async e=>{e.preventDefault();try{const r=await api('/admin/payment-qr',{method:'POST',form:new FormData(e.target)});$('#qe').innerHTML=`<span class="ok">Saved. UPI ID: ${esc(r.qr.upi_id)}</span>`}catch(x){$('#qe').textContent=x.message}}},
 async claims(el,again){const r=(await api('/claims?status=pending')).claims;el.innerHTML=r.length?r.map(c=>`<div class="row"><div><b>${esc(c.reference)}</b> · ${inr(c.total_paise)}<br><span class="mut">UTR ${esc(c.utr)} · ${when(c.created_at)}</span></div><div><button class="btn sm" data-ok="${c.id}" data-amt="${c.total_paise}">Approve</button> <button class="btn no sm" data-no="${c.id}">Reject</button></div></div>`).join(''):'<p class="mut">No payments waiting.</p>';
  el.onclick=e=>{const ok=e.target.closest('[data-ok]'),no=e.target.closest('[data-no]');
   if(ok){const v=prompt('Check your bank/UPI app. How much (in ₹) actually arrived for this UTR?');if(v)act(`/claims/${ok.dataset.ok}/approve`,{amount_received_paise:Math.round(Number(v)*100)},again)()}
   if(no){const note=prompt('Reason for rejecting:');if(note)act(`/claims/${no.dataset.no}/reject`,{note},again)()}}}};

who();route();
</script>
